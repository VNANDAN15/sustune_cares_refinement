name: Sustune Care CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Lint Source Code
        run: npm run lint

      - name: Run Integrity Suite
        run: npm test

      - name: Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://www.sustunecare.com"
          LEAD_INTAKE_ADAPTER: "none"
